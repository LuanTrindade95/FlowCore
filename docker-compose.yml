services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: flowcore
      MYSQL_USER: flowcore
      MYSQL_PASSWORD: flowcore
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - backend/.env.example
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - ./docker/php.ini:/usr/local/etc/php/conf.d/flowcore.ini:ro

  horizon:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    depends_on:
      - backend
    env_file:
      - backend/.env.example
    command: ["php", "artisan", "horizon"]
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - ./docker/php.ini:/usr/local/etc/php/conf.d/flowcore.ini:ro

  reverb:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    depends_on:
      - backend
    env_file:
      - backend/.env.example
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - ./docker/php.ini:/usr/local/etc/php/conf.d/flowcore.ini:ro

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql-data:
