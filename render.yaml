# FlowCore staging Blueprint.
#
# This template assumes:
# - Frontend static hosting remains on Netlify.
# - MySQL and Valkey/Redis-compatible services are provided externally by Aiven.
# - Secrets are filled manually in Render Dashboard.

services:
  - type: web
    name: flowcore-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_NAME
        value: FlowCore
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://flowcore-api-urkx.onrender.com
      - key: FRONTEND_URL
        value: https://flowcore-luantrindade.netlify.app
      - key: FRONTEND_URLS
        value: https://flowcore-luantrindade.netlify.app
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: portfolio-portfolio-01.l.aivencloud.com
      - key: DB_PORT
        value: "27717"
      - key: DB_DATABASE
        value: flowcore_staging
      - key: DB_USERNAME
        value: flowcore_app
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_CLIENT
        value: phpredis
      - key: REDIS_HOST
        value: flowcore-valkey-portfolio-01.a.aivencloud.com
      - key: REDIS_PORT
        value: "27718"
      - key: REDIS_USERNAME
        value: default
      - key: REDIS_SCHEME
        value: tls
      - key: REDIS_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: redis
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_APP_ID
        sync: false
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false
      - key: REVERB_HOST
        value: flowcore-reverb.onrender.com
      - key: REVERB_BROADCAST_HOST
        value: flowcore-reverb.onrender.com
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: https
      - key: REVERB_SERVER_HOST
        value: 0.0.0.0
      - key: REVERB_SERVER_PORT
        value: "8080"

  - type: worker
    name: flowcore-horizon
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    dockerCommand: php artisan horizon
    autoDeploy: false
    envVars:
      - fromGroup: flowcore-staging-shared

  - type: worker
    name: flowcore-scheduler
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    dockerCommand: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    autoDeploy: false
    envVars:
      - fromGroup: flowcore-staging-shared

  - type: web
    name: flowcore-reverb
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    dockerCommand: php artisan reverb:start --host=0.0.0.0 --port=${PORT}
    autoDeploy: false
    envVars:
      - fromGroup: flowcore-staging-shared

envVarGroups:
  - name: flowcore-staging-shared
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: portfolio-portfolio-01.l.aivencloud.com
      - key: DB_PORT
        value: "27717"
      - key: DB_DATABASE
        value: flowcore_staging
      - key: DB_USERNAME
        value: flowcore_app
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_CLIENT
        value: phpredis
      - key: REDIS_HOST
        value: flowcore-valkey-portfolio-01.a.aivencloud.com
      - key: REDIS_PORT
        value: "27718"
      - key: REDIS_USERNAME
        value: default
      - key: REDIS_SCHEME
        value: tls
      - key: REDIS_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: redis
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_APP_ID
        sync: false
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false
      - key: REVERB_HOST
        value: flowcore-reverb.onrender.com
      - key: REVERB_BROADCAST_HOST
        value: flowcore-reverb.onrender.com
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: https
